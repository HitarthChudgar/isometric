<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --radius-sm: 8px;
      --radius-md: 11px;
      --ease-out: cubic-bezier(0.2, 0, 0, 1);
      --brand: var(--figma-color-bg-brand, #0c8ce9);
      --brand-strong: var(--figma-color-bg-brand-pressed, #0070cc);
      --text-onbrand: var(--figma-color-text-onbrand, #ffffff);
      --text: var(--figma-color-text, #1e1e1e);
      --text-secondary: var(--figma-color-text-secondary, #6b6b6b);
      --bg: var(--figma-color-bg, #ffffff);
      --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
      --bg-hover: var(--figma-color-bg-hover, #ececec);
      --bg-pressed: var(--figma-color-bg-pressed, #e5e5e5);
      --bg-selected: var(--figma-color-bg-selected, #e5f4ff);
      --border: var(--figma-color-border, #e5e5e5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 260px;
      height: 328px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 12px;
      gap: 8px;
      overflow: hidden;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 32px;
      flex-shrink: 0;
    }

    .field label {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .presets {
      display: flex;
      gap: 4px;
    }

    .preset {
      min-width: 36px;
      min-height: 32px;
      padding-inline: 8px;
      background: var(--bg-secondary);
      font-variant-numeric: tabular-nums;
    }

    .preset.is-active {
      background: var(--bg-selected);
      color: var(--text);
    }

    .field input {
      width: 48px;
      margin-inline-start: auto;
      min-height: 32px;
      padding: 0 10px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--bg-secondary);
      color: inherit;
      font: inherit;
      font-variant-numeric: tabular-nums;
      text-align: start;
      outline: none;
    }

    input[type="number"] {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      appearance: none;
      margin: 0;
    }

    .preview-stage {
      position: relative;
      height: 112px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      overflow: hidden;
      flex-shrink: 0;
    }

    .preview-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      color: var(--text-secondary);
      text-align: center;
      text-wrap: pretty;
    }

    .preview-empty[hidden] {
      display: none;
    }

    .preview-meta {
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    #preview-img {
      position: absolute;
      top: 0;
      inset-inline-start: 0;
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      transform-origin: 0 0;
      pointer-events: none;
      outline: 1px solid rgb(0 0 0 / 0.1);
      outline-offset: -1px;
    }

    #preview-img[hidden] {
      display: none;
    }

    .dir-well {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding-inline: 6px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      white-space: nowrap;
    }

    .dir-well button {
      border-radius: 0;
    }

    .dir-well button:nth-child(odd) {
      border-inline-end: 1px solid var(--border);
    }

    .dir-well button:nth-child(-n + 2) {
      border-block-end: 1px solid var(--border);
    }

    .dir-well button.is-active {
      background: var(--bg-selected);
      color: var(--text);
    }

    .reset {
      flex-shrink: 0;
      background: var(--bg-secondary);
    }

    .icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    button:focus-visible,
    .field input:focus-visible {
      box-shadow: 0 0 0 2px var(--brand);
    }

    @media (hover: hover) {
      .field input:hover,
      .preset:hover {
        background: var(--bg-hover);
      }

      .preset.is-active:hover {
        background: var(--bg-selected);
      }

      .dir-well button:hover {
        background: var(--bg-selected);
        color: var(--text);
      }

      .reset:hover {
        background: var(--brand-strong);
        color: var(--text-onbrand);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .field input {
        transition-property: box-shadow, background-color;
        transition-duration: 120ms;
        transition-timing-function: var(--ease-out);
      }

      button {
        transition-property: background-color, box-shadow, scale;
        transition-duration: 120ms;
        transition-timing-function: var(--ease-out);
      }

      #preview-img {
        transition-property: transform;
        transition-duration: 150ms;
        transition-timing-function: var(--ease-out);
      }

      button:active {
        scale: 0.96;
      }
    }

    @media (forced-colors: active) {
      button:focus-visible,
      .field input:focus-visible {
        outline: 2px solid CanvasText;
        outline-offset: 2px;
        box-shadow: none;
      }

      .dir-well button.is-active {
        outline: 2px solid Highlight;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="field">
      <label for="angle">Angle</label>
      <input id="angle" type="number" inputmode="decimal" value="30" step="1" />
      <div class="presets" role="group" aria-label="Angle presets">
        <button type="button" class="preset" data-angle="15">15°</button>
        <button type="button" class="preset is-active" data-angle="30" aria-pressed="true">30°</button>
        <button type="button" class="preset" data-angle="45">45°</button>
      </div>
    </div>

    <div class="preview-stage" id="preview-stage" role="img" aria-labelledby="preview-meta">
      <p class="preview-empty" id="preview-empty">Select a layer to preview</p>
      <img id="preview-img" alt="" hidden />
    </div>
    <p class="preview-meta" id="preview-meta" role="status">Top left · 30°</p>

    <div class="dir-well" id="direction-grid" role="group" aria-label="Projection">
      <button type="button" data-direction="top-left" aria-pressed="true">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 17V7h10" />
          <path d="m17 17-10-10" />
        </svg>
        Top left
      </button>
      <button type="button" data-direction="top-right" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 7h10v10" />
          <path d="M7 17 17 7" />
        </svg>
        Top right
      </button>
      <button type="button" data-direction="left" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m12 19-7-7 7-7" />
          <path d="M19 12H5" />
        </svg>
        Left
      </button>
      <button type="button" data-direction="right" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
        Right
      </button>
    </div>

    <button type="button" class="reset" id="reset">Reset transform</button>
  </div>

  <script>
    const DIRECTION_LABELS = {
      "top-left": "Top left",
      "top-right": "Top right",
      left: "Left",
      right: "Right"
    };

    const angleInput = document.getElementById("angle");
    const previewStage = document.getElementById("preview-stage");
    const previewImg = document.getElementById("preview-img");
    const previewEmpty = document.getElementById("preview-empty");
    const previewMeta = document.getElementById("preview-meta");
    const directionButtons = document.querySelectorAll("[data-direction]");
    const presetButtons = document.querySelectorAll("[data-angle]");

    let committedDirection = "top-left";
    let previewDirection = "top-left";
    let previewUrl = null;
    let hasLayerPreview = false;

    function readAngle() {
      const angle = parseFloat(angleInput.value);
      return Number.isFinite(angle) ? angle : 30;
    }

    function syncPresets() {
      const angle = readAngle();
      presetButtons.forEach(function (button) {
        const isActive = Number(button.getAttribute("data-angle")) === angle;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
      });
    }

    function post(pluginMessage) {
      parent.postMessage({ pluginMessage: pluginMessage }, "*");
    }

    function toRadians(degrees) {
      return (degrees * Math.PI) / 180;
    }

    function multiplyLinear(a, b) {
      return [
        [a[0][0] * b[0][0] + a[0][1] * b[1][0], a[0][0] * b[0][1] + a[0][1] * b[1][1]],
        [a[1][0] * b[0][0] + a[1][1] * b[1][0], a[1][0] * b[0][1] + a[1][1] * b[1][1]]
      ];
    }

    function composeSSR(sx, sy, kx, ky) {
      return multiplyLinear(
        [[1, kx], [ky, 1]],
        [[sx, 0], [0, sy]]
      );
    }

    function safeDiv(num, den) {
      return Math.abs(den) < 1e-8 ? 0 : num / den;
    }

    function buildDirectionalMatrix(direction, angle) {
      const theta = toRadians(angle);
      const cos = Math.cos(theta);
      const sin = Math.sin(theta);
      const tan = safeDiv(sin, cos);
      const cot = safeDiv(cos, sin);

      if (direction === "top-left") return composeSSR(cos, sin, -cot, tan);
      if (direction === "top-right") return composeSSR(cos, sin, cot, -tan);
      if (direction === "left") return composeSSR(cos, 1, 0, tan);
      return composeSSR(cos, 1, 0, -tan);
    }

    function sourceSize() {
      if (!previewImg.hidden && previewImg.naturalWidth > 0) {
        return { w: previewImg.naturalWidth, h: previewImg.naturalHeight, el: previewImg };
      }
      return null;
    }

    function updatePreview() {
      const angle = readAngle();
      syncPresets();
      const matrix = buildDirectionalMatrix(previewDirection, angle);
      const a = matrix[0][0];
      const c = matrix[0][1];
      const b = matrix[1][0];
      const d = matrix[1][1];
      const size = sourceSize();
      if (!size) {
        previewMeta.textContent = DIRECTION_LABELS[previewDirection] + " · " + angle + "°";
        directionButtons.forEach(function (button) {
          const direction = button.getAttribute("data-direction");
          button.classList.toggle("is-active", direction === previewDirection);
          button.setAttribute("aria-pressed", direction === committedDirection ? "true" : "false");
        });
        return;
      }
      const corners = [[0, 0], [size.w, 0], [size.w, size.h], [0, size.h]];
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;

      for (let i = 0; i < corners.length; i++) {
        const x = a * corners[i][0] + c * corners[i][1];
        const y = b * corners[i][0] + d * corners[i][1];
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x);
        maxY = Math.max(maxY, y);
      }

      const boundsW = Math.max(maxX - minX, 1);
      const boundsH = Math.max(maxY - minY, 1);
      const pad = 20;
      const scale = Math.min(
        (previewStage.clientWidth - pad) / boundsW,
        (previewStage.clientHeight - pad) / boundsH
      );
      const tx = (previewStage.clientWidth - boundsW * scale) / 2 - minX * scale;
      const ty = (previewStage.clientHeight - boundsH * scale) / 2 - minY * scale;

      previewImg.style.transform =
        "matrix(" +
        (a * scale) + ", " +
        (b * scale) + ", " +
        (c * scale) + ", " +
        (d * scale) + ", " +
        tx + ", " +
        ty + ")";

      previewMeta.textContent = DIRECTION_LABELS[previewDirection] + " · " + angle + "°";

      directionButtons.forEach(function (button) {
        const direction = button.getAttribute("data-direction");
        const isPreview = direction === previewDirection;
        const isCommitted = direction === committedDirection;
        button.classList.toggle("is-active", isPreview);
        button.setAttribute("aria-pressed", isCommitted ? "true" : "false");
      });
    }

    function setPreviewDirection(direction) {
      previewDirection = direction;
      updatePreview();
    }

    function setPreviewBytes(bytes) {
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      if (!bytes || !bytes.byteLength) {
        hasLayerPreview = false;
        previewStage.classList.remove("has-layer");
        previewImg.hidden = true;
        previewImg.removeAttribute("src");
        previewEmpty.hidden = false;
        updatePreview();
        return;
      }

      const blob = new Blob([new Uint8Array(bytes)], { type: "image/png" });
      previewUrl = URL.createObjectURL(blob);
      previewImg.onload = function () {
        hasLayerPreview = true;
        previewStage.classList.add("has-layer");
        previewImg.hidden = false;
        previewEmpty.hidden = true;
        updatePreview();
      };
      previewImg.src = previewUrl;
    }

    directionButtons.forEach(function (button) {
      const direction = button.getAttribute("data-direction");

      button.addEventListener("pointerenter", function () {
        setPreviewDirection(direction);
      });

      button.addEventListener("focus", function () {
        setPreviewDirection(direction);
      });

      button.addEventListener("click", function () {
        committedDirection = direction;
        setPreviewDirection(direction);
        post({
          type: "transform",
          angle: readAngle(),
          direction: direction
        });
      });
    });

    document.getElementById("direction-grid").addEventListener("pointerleave", function () {
      setPreviewDirection(committedDirection);
    });

    document.getElementById("direction-grid").addEventListener("focusout", function (event) {
      if (!event.currentTarget.contains(event.relatedTarget)) {
        setPreviewDirection(committedDirection);
      }
    });

    document.getElementById("reset").addEventListener("click", function () {
      post({ type: "reset" });
    });

    presetButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        angleInput.value = button.getAttribute("data-angle");
        updatePreview();
      });
    });

    angleInput.addEventListener("input", updatePreview);
    angleInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        angleInput.blur();
      }
    });

    window.onmessage = function (event) {
      const msg = event.data && event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === "selection-preview") {
        setPreviewBytes(msg.bytes);
      }
    };

    post({ type: "ready" });
    updatePreview();
  </script>
</body>
</html>
